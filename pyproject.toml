[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yurtle-kanban"
version = "2.2.0"
description = "File-based kanban with a queryable knowledge graph. SPARQL, semantic search, and natural language queries over Yurtle (Turtle RDF in Markdown). Git is your database."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Hank Head", email = "hankh1844@gmail.com" }
]
keywords = [
    "kanban",
    "yurtle",
    "rdf",
    "turtle",
    "workflow",
    "project-management",
    "cli",
    "mcp"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "rdflib>=7.0.0",
    "yurtle-rdflib>=0.3.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "tomli>=1.1; python_version < '3.11'",  # tomllib for 3.10 in tests (#555)
]
# the MCP server is a stdlib stdio loop; it never imports the `mcp` package, so
# the extra is kept only so `yurtle-kanban[mcp]` still resolves (#555)
mcp = []
search = [
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
]
llm = [
    "anthropic>=0.25.0",
]
all = [
    "yurtle-kanban[search,llm,mcp]",
]

[project.scripts]
yurtle-kanban = "yurtle_kanban.cli:main"
yurtle-kanban-mcp = "yurtle_kanban.mcp.server:run_server"

[project.urls]
Homepage = "https://github.com/hankh95/yurtle-kanban"
Documentation = "https://github.com/hankh95/yurtle-kanban#readme"
Repository = "https://github.com/hankh95/yurtle-kanban"
Issues = "https://github.com/hankh95/yurtle-kanban/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/yurtle_kanban"]

[tool.hatch.build]
include = [
    "src/yurtle_kanban/**/*.py",
    "templates/**/*.md",
    "themes/**/*.yaml",
    "examples/**/*",
    "skills/**/*.md",
]

[tool.hatch.build.targets.wheel.shared-data]
"templates" = "share/yurtle-kanban/templates"
"themes" = "share/yurtle-kanban/themes"
"skills" = "share/yurtle-kanban/skills"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# test data lines (fixtures, argv lists, regexes) and names that shout a decision
# (`..._IS_still_orphaned`) read better as they are (#333)
"tests/**" = ["E501", "N802"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
