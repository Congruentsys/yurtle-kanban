# py-delta routing for this repository (#1248), read by scripts/py_delta.py.
#
#   <path-glob> -> <test-glob> [<test-glob> ...]  |  FULL  |  NONE
#
# The FIRST matching rule wins; `*` crosses `/`. A path no rule matches is FULL, and py_delta
# itself makes the script, this file, build/pytest files and any symlink FULL. Where it is not
# certain which tests read a path, the path is FULL: this file only ever narrows the run for
# documentation that a known set of tests reads. Each subset is every test file that names the
# path (grep over tests/), closed over test modules that import those (tests share helpers), plus
# test_1209, which reads every tracked file. A new test that reads one of these documents must be
# added to its line here.

# Code: everything. Tests import each other's helpers; scripts are code the tests run.
src/* -> FULL
tests/* -> FULL
scripts/* -> FULL
# Packaged data the CLI reads at run time (`init` installs skills/, themes, templates).
skills/* -> FULL
templates/* -> FULL
themes/* -> FULL
examples/* -> FULL

